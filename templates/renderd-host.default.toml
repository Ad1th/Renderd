# Renderd macOS Host Daemon Configuration Template

[host]
# Display index to capture (0 = primary display)
display_id = 0

# Target capture framerate (1 to 240 fps)
target_fps = 60

# Starting hardware encoder bitrate in kbps (1000 to 200000 kbps). The ABR
# controller moves from here within [abr.min_bitrate_kbps, abr.max_bitrate_kbps],
# backing off as soon as queuing delay builds, so starting a little high is
# cheap: it is corrected within a few hundred milliseconds.
max_bitrate_kbps = 8000

# Hardware video encoder codec ("hevc" or "h264")
codec = "hevc"

# Enable vsync phase synchronization with viewer
vsync_phase_sync = true

# Create a virtual display sized to the viewer's monitor and stream that, making
# the viewer an additional desktop. Set to false to mirror display_id instead.
extend_display = true

# Tallest picture to encode, in pixels (width follows the display's aspect
# ratio). 0 picks it from abr.max_bitrate_kbps: 1080p60 needs ~10 Mbps of
# desktop text, so a 6 Mbps ceiling streams 900p60 instead of a 1080p picture
# that cannot fit. Set a height (360 to 4320) to force one.
max_stream_height = 0

# Drop the encoded resolution while the link carries less than the stream's
# size needs (and raise it again when it carries more), in steps of 896, 720
# and 544 lines. On a slow link a full-screen change at 1080p is a frame of
# 80 KB or more, a third of a second at 2 Mbps; fewer pixels keep it snappy.
# The size chosen above (or by max_stream_height) is the most it will use.
adaptive_resolution = true

[network]
# IP address string to bind host daemon socket
bind_address = "0.0.0.0"

# UDP port for host QUIC listener socket
listen_port = 4433

# QUIC Maximum Transmission Unit (1200 to 1500 bytes)
quic_mtu = 1350

# Peer connection timeout in milliseconds
connect_timeout_ms = 5000

[crypto]
# macOS Keychain service name
keychain_service = "dev.renderd.daemon"

# Require mutual TLS or pairing token authentication
require_auth = true

[abr]
# Minimum allowed encoder bitrate in kbps
min_bitrate_kbps = 1500

# Maximum allowed encoder bitrate in kbps. Set this to roughly what your link
# sustains: it also picks the streamed resolution (see host.max_stream_height).
# For a link that tops out around 6 Mbps, use 6000.
max_bitrate_kbps = 10000

# Largest single increase when probing for more bandwidth, in kbps. Probes
# otherwise grow the bitrate by 8% at a time.
step_kbps = 1000

# Packet loss rate (0.0 to 1.0) above which the bitrate stops probing upward.
# Lost fragments are resent, so light random loss costs a round trip rather
# than picture quality; the bitrate is only cut at five times this rate (or
# when queuing delay builds), and halved at 15%.
loss_threshold = 0.02
