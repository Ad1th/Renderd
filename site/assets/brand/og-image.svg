<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Renderd Open Graph image">
  <title>Renderd — High-performance macOS → Windows Display Streaming</title>
  <desc>Open Graph (og:image) for renderd GitHub repository and social sharing</desc>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0D0D0D"/>

  <!-- Grid -->
  <line x1="75"  y1="0" x2="75"  y2="630" stroke="#161616" stroke-width="1"/>
  <line x1="150" y1="0" x2="150" y2="630" stroke="#161616" stroke-width="1"/>
  <line x1="225" y1="0" x2="225" y2="630" stroke="#161616" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="#161616" stroke-width="1"/>
  <line x1="375" y1="0" x2="375" y2="630" stroke="#161616" stroke-width="1"/>
  <line x1="450" y1="0" x2="450" y2="630" stroke="#161616" stroke-width="1"/>
  <line x1="525" y1="0" x2="525" y2="630" stroke="#161616" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#161616" stroke-width="1"/>
  <line x1="675" y1="0" x2="675" y2="630" stroke="#161616" stroke-width="1"/>
  <line x1="750" y1="0" x2="750" y2="630" stroke="#161616" stroke-width="1"/>
  <line x1="825" y1="0" x2="825" y2="630" stroke="#161616" stroke-width="1"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="#161616" stroke-width="1"/>
  <line x1="975" y1="0" x2="975" y2="630" stroke="#161616" stroke-width="1"/>
  <line x1="1050" y1="0" x2="1050" y2="630" stroke="#161616" stroke-width="1"/>
  <line x1="1125" y1="0" x2="1125" y2="630" stroke="#161616" stroke-width="1"/>
  <line x1="0" y1="75"  x2="1200" y2="75"  stroke="#161616" stroke-width="1"/>
  <line x1="0" y1="150" x2="1200" y2="150" stroke="#161616" stroke-width="1"/>
  <line x1="0" y1="225" x2="1200" y2="225" stroke="#161616" stroke-width="1"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#161616" stroke-width="1"/>
  <line x1="0" y1="375" x2="1200" y2="375" stroke="#161616" stroke-width="1"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#161616" stroke-width="1"/>
  <line x1="0" y1="525" x2="1200" y2="525" stroke="#161616" stroke-width="1"/>

  <!-- Left vertical accent bar -->
  <rect x="0" y="0" width="4" height="630" fill="#00E5FF" opacity="0.7"/>

  <!-- Icon mark (centered left block) -->
  <g transform="translate(80, 165)">
    <rect width="300" height="300" rx="20" fill="#111111"/>
    <!-- R strokes at 300px scale -->
    <rect x="70" y="60"  width="20" height="180" fill="#E8F4FD"/>
    <rect x="70" y="60"  width="110" height="20"  fill="#E8F4FD"/>
    <rect x="70" y="140" width="110" height="20"  fill="#E8F4FD"/>
    <rect x="180" y="60" width="20"  height="100" fill="#E8F4FD"/>
    <rect x="140" y="160" width="20" height="20"  fill="#E8F4FD"/>
    <rect x="160" y="180" width="20" height="20"  fill="#E8F4FD"/>
    <rect x="180" y="200" width="20" height="20"  fill="#E8F4FD"/>
    <rect x="200" y="220" width="20" height="20"  fill="#E8F4FD"/>
    <rect x="200" y="60"  width="20" height="20"  fill="#00E5FF"/>
  </g>

  <!-- Wordmark -->
  <text
    x="420"
    y="310"
    font-family="'JetBrains Mono', 'Fira Code', monospace"
    font-size="112"
    font-weight="700"
    letter-spacing="-2"
    fill="#E8F4FD"
  >renderd</text>

  <!-- Accent rule -->
  <rect x="420" y="328" width="500" height="3" fill="#00E5FF" opacity="0.6"/>

  <!-- Tagline -->
  <text
    x="420"
    y="382"
    font-family="monospace"
    font-size="22"
    fill="#6B8599"
    letter-spacing="0.5"
  >macOS → Windows · QUIC · Zero-copy · MIT · Rust</text>

  <!-- Sub-badges -->
  <rect x="420" y="418" width="76" height="26" rx="3" fill="#0D1F0D" stroke="#2A4A2A" stroke-width="1"/>
  <text x="458" y="435" font-family="monospace" font-size="11" fill="#4CAF50" text-anchor="middle" font-weight="600">MIT</text>

  <rect x="508" y="418" width="96" height="26" rx="3" fill="#1F0D00" stroke="#4A2A00" stroke-width="1"/>
  <text x="556" y="435" font-family="monospace" font-size="11" fill="#FF6B35" text-anchor="middle" font-weight="600">Rust 1.80+</text>

  <rect x="616" y="418" width="80" height="26" rx="3" fill="#00000D" stroke="#00007A" stroke-width="1"/>
  <text x="656" y="435" font-family="monospace" font-size="11" fill="#4444FF" text-anchor="middle" font-weight="600">QUIC UDP</text>

  <rect x="708" y="418" width="100" height="26" rx="3" fill="#0D0D1A" stroke="#2A2A4A" stroke-width="1"/>
  <text x="758" y="435" font-family="monospace" font-size="11" fill="#8888FF" text-anchor="middle" font-weight="600">sub-16ms</text>
</svg>
