<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Renderd icon mark">
  <title>Renderd Icon</title>
  <desc>Renderd icon mark — terminal-grid R with datagram pixel</desc>

  <!-- Background -->
  <rect x="0" y="0" width="120" height="120" rx="12" fill="#0D0D0D"/>

  <!-- Vertical stroke -->
  <rect x="28" y="24" width="8" height="72" fill="#E8F4FD"/>

  <!-- Top horizontal bar -->
  <rect x="28" y="24" width="44" height="8" fill="#E8F4FD"/>

  <!-- Mid horizontal bar -->
  <rect x="28" y="56" width="44" height="8" fill="#E8F4FD"/>

  <!-- Right vertical top section -->
  <rect x="72" y="24" width="8" height="40" fill="#E8F4FD"/>

  <!-- Stepped diagonal leg -->
  <rect x="56" y="64" width="8" height="8" fill="#E8F4FD"/>
  <rect x="64" y="72" width="8" height="8" fill="#E8F4FD"/>
  <rect x="72" y="80" width="8" height="8" fill="#E8F4FD"/>
  <rect x="80" y="88" width="8" height="8" fill="#E8F4FD"/>

  <!-- Accent datagram pixel -->
  <rect x="80" y="24" width="8" height="8" fill="#00E5FF"/>
</svg>
