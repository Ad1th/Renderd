<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" role="img" aria-label="Renderd logo">
  <title>Renderd</title>
  <desc>Renderd — peer-to-peer macOS to Windows display streaming daemon</desc>

  <!-- Background: transparent (renders on dark by default) -->

  <!-- ─── Icon Mark ───────────────────────────────────────────────── -->
  <!-- Grid-constructed "R" using terminal box-drawing geometry -->
  <!-- Outer frame -->
  <rect x="0" y="0" width="120" height="120" rx="12" fill="#0D0D0D"/>

  <!-- Vertical stroke (left leg of R) -->
  <rect x="28" y="24" width="8" height="72" fill="#E8F4FD"/>

  <!-- Top horizontal bar -->
  <rect x="28" y="24" width="44" height="8" fill="#E8F4FD"/>

  <!-- Mid horizontal bar -->
  <rect x="28" y="56" width="44" height="8" fill="#E8F4FD"/>

  <!-- Right arc top section (flat in terminal style) -->
  <rect x="72" y="24" width="8" height="40" fill="#E8F4FD"/>

  <!-- Diagonal leg (bottom-right of R) — stepped/pixelated for terminal feel -->
  <!-- Step 1 -->
  <rect x="56" y="64" width="8" height="8" fill="#E8F4FD"/>
  <!-- Step 2 -->
  <rect x="64" y="72" width="8" height="8" fill="#E8F4FD"/>
  <!-- Step 3 -->
  <rect x="72" y="80" width="8" height="8" fill="#E8F4FD"/>
  <!-- Step 4 -->
  <rect x="80" y="88" width="8" height="8" fill="#E8F4FD"/>

  <!-- Accent dot — single datagram pixel (cyan) -->
  <rect x="80" y="24" width="8" height="8" fill="#00E5FF"/>

  <!-- ─── Wordmark ─────────────────────────────────────────────────── -->
  <text
    x="144"
    y="78"
    font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', monospace"
    font-size="52"
    font-weight="700"
    letter-spacing="-1"
    fill="#E8F4FD"
  >renderd</text>

  <!-- Accent underscore cursor blink indicator -->
  <rect x="144" y="87" width="220" height="3" fill="#00E5FF" opacity="0.35"/>
</svg>
