<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Renderd favicon">
  <title>Renderd</title>
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#0D0D0D"/>

  <!-- Pixel-grid R at 32×32 — 2px grid units -->
  <!-- Vertical left stroke: x=6, y=6..26, w=3 -->
  <rect x="6" y="6" width="3" height="20" fill="#E8F4FD"/>

  <!-- Top bar: x=6..18, y=6, h=3 -->
  <rect x="6" y="6" width="12" height="3" fill="#E8F4FD"/>

  <!-- Mid bar: x=6..18, y=14, h=3 -->
  <rect x="6" y="14" width="12" height="3" fill="#E8F4FD"/>

  <!-- Right vertical (top half): x=18, y=6..17 -->
  <rect x="18" y="6" width="3" height="11" fill="#E8F4FD"/>

  <!-- Stepped diagonal leg -->
  <rect x="14" y="17" width="3" height="3" fill="#E8F4FD"/>
  <rect x="17" y="20" width="3" height="3" fill="#E8F4FD"/>
  <rect x="20" y="23" width="3" height="3" fill="#E8F4FD"/>

  <!-- Accent pixel (cyan datagram dot) -->
  <rect x="21" y="6" width="3" height="3" fill="#00E5FF"/>
</svg>
