<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Renderd — GitHub social banner">
  <title>Renderd — Peer-to-peer macOS to Windows display streaming</title>
  <desc>GitHub social preview banner for the Renderd open-source project</desc>

  <!-- ─── Background ───────────────────────────────────────────────── -->
  <rect width="1280" height="640" fill="#0D0D0D"/>

  <!-- Subtle grid pattern — terminal graph paper feel -->
  <!-- Vertical grid lines -->
  <line x1="80"  y1="0" x2="80"  y2="640" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="640" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="640" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="640" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="640" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="640" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="560" y1="0" x2="560" y2="640" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="640" y1="0" x2="640" y2="640" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="640" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="640" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="880" y1="0" x2="880" y2="640" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="960" y1="0" x2="960" y2="640" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="1040" y1="0" x2="1040" y2="640" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="1120" y1="0" x2="1120" y2="640" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="1200" y1="0" x2="1200" y2="640" stroke="#1A1A1A" stroke-width="1"/>
  <!-- Horizontal grid lines -->
  <line x1="0" y1="80"  x2="1280" y2="80"  stroke="#1A1A1A" stroke-width="1"/>
  <line x1="0" y1="160" x2="1280" y2="160" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="0" y1="240" x2="1280" y2="240" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="0" y1="320" x2="1280" y2="320" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="0" y1="400" x2="1280" y2="400" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="0" y1="480" x2="1280" y2="480" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="0" y1="560" x2="1280" y2="560" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ─── Network signal lines (abstract QUIC datagram flow) ─────── -->
  <!-- Left flow line -->
  <polyline points="80,480 320,320 560,280 800,200 1040,160" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.18"/>
  <!-- Right flow line -->
  <polyline points="80,520 320,380 560,340 800,260 1040,200" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.10"/>
  <!-- Datagram nodes on primary line -->
  <circle cx="320" cy="320" r="3" fill="#00E5FF" opacity="0.45"/>
  <circle cx="560" cy="280" r="3" fill="#00E5FF" opacity="0.45"/>
  <circle cx="800" cy="200" r="3" fill="#00E5FF" opacity="0.45"/>
  <circle cx="1040" cy="160" r="3" fill="#00E5FF" opacity="0.45"/>

  <!-- ─── Large Icon Mark (left anchor) ─────────────────────────────── -->
  <g transform="translate(100, 176)">
    <!-- Icon background -->
    <rect width="288" height="288" rx="24" fill="#111111"/>

    <!-- Terminal-grid R at 288px — scaled from 120px: factor 2.4 -->
    <!-- Vertical stroke -->
    <rect x="67.2" y="57.6"  width="19.2" height="172.8" fill="#E8F4FD"/>
    <!-- Top bar -->
    <rect x="67.2" y="57.6"  width="105.6" height="19.2" fill="#E8F4FD"/>
    <!-- Mid bar -->
    <rect x="67.2" y="134.4" width="105.6" height="19.2" fill="#E8F4FD"/>
    <!-- Right vertical top -->
    <rect x="172.8" y="57.6" width="19.2" height="96" fill="#E8F4FD"/>
    <!-- Stepped diagonal -->
    <rect x="134.4" y="153.6" width="19.2" height="19.2" fill="#E8F4FD"/>
    <rect x="153.6" y="172.8" width="19.2" height="19.2" fill="#E8F4FD"/>
    <rect x="172.8" y="192"   width="19.2" height="19.2" fill="#E8F4FD"/>
    <rect x="192"   y="211.2" width="19.2" height="19.2" fill="#E8F4FD"/>
    <!-- Accent pixel -->
    <rect x="192"   y="57.6"  width="19.2" height="19.2" fill="#00E5FF"/>
  </g>

  <!-- ─── Wordmark ───────────────────────────────────────────────── -->
  <text
    x="440"
    y="338"
    font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', monospace"
    font-size="120"
    font-weight="700"
    letter-spacing="-3"
    fill="#E8F4FD"
  >renderd</text>

  <!-- Thin accent line under wordmark -->
  <rect x="440" y="356" width="530" height="4" fill="#00E5FF" opacity="0.5"/>

  <!-- ─── Tagline ──────────────────────────────────────────────────── -->
  <text
    x="440"
    y="416"
    font-family="'JetBrains Mono', 'Fira Code', monospace"
    font-size="24"
    font-weight="400"
    letter-spacing="0.5"
    fill="#8BA3B8"
  >peer-to-peer display streaming  ·  sub-16ms  ·  QUIC + HEVC  ·  Rust</text>

  <!-- ─── Corner badges ──────────────────────────────────────────── -->
  <!-- MIT badge -->
  <rect x="440" y="456" width="80" height="28" rx="4" fill="#1A2A1A"/>
  <text x="480" y="474" font-family="monospace" font-size="12" font-weight="600" fill="#4CAF50" text-anchor="middle">MIT</text>

  <!-- Rust badge -->
  <rect x="532" y="456" width="100" height="28" rx="4" fill="#2A1A0D"/>
  <text x="582" y="474" font-family="monospace" font-size="12" font-weight="600" fill="#FF6B35" text-anchor="middle">Rust 1.80+</text>

  <!-- Pre-release badge -->
  <rect x="644" y="456" width="110" height="28" rx="4" fill="#1A1A2A"/>
  <text x="699" y="474" font-family="monospace" font-size="12" font-weight="600" fill="#8888FF" text-anchor="middle">pre-release</text>

  <!-- ─── Bottom rule ──────────────────────────────────────────────── -->
  <rect x="0" y="604" width="1280" height="1" fill="#2A2A2A"/>
  <text
    x="640"
    y="626"
    font-family="monospace"
    font-size="14"
    fill="#3A3A3A"
    text-anchor="middle"
    letter-spacing="3"
  >github.com/Ad1th/renderd</text>
</svg>
