version: 2
updates:
  # Both ecosystems run on the 1st and 15th of each month (04:00 UTC), roughly
  # fortnightly. Security updates are separate and still arrive immediately.
  # Cargo workspace dependencies (Rust)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 4 1,15 * *"
    open-pull-requests-limit: 5
    labels:
      - "type: chore"
      - "crate: deps"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 4 1,15 * *"
    open-pull-requests-limit: 5
    labels:
      - "type: ci"
      - "crate: deps"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
