name: Feature Request
description: Suggest an idea or feature for Renderd
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like. Refer to RFC-0002 §20 (Future Work) if applicable.
    validations:
      required: true
