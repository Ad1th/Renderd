name: Bug Report
description: Create a bug report to help us improve Renderd
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: What platform did this occur on?
      options:
        - macOS Host (Apple Silicon)
        - Windows Viewer (Windows 10+)
        - Both
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal / Tracing Logs
      description: Paste relevant logs from `tracing` output.
      render: shell
