name: Security
on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"

jobs:
  # cargo-deny license/ban check now also runs on every PR via ci.yml.
  # This weekly job re-runs it to catch newly published advisory-db advisories
  # that may affect deps added since the last PR.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
