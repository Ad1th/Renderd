name: Benchmarks
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  bench-host:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmarks
        run: |
          BENCH_FOUND=0
          for crate in crates/renderd-frame crates/renderd-net crates/renderd-crypto crates/renderd-abr crates/renderd-clock; do
            if [ -d "$crate/benches" ]; then
              BENCH_FOUND=1
              break
            fi
          done

          if [ "$BENCH_FOUND" -eq 1 ]; then
            cargo bench --package renderd-frame --package renderd-net \
              --package renderd-crypto --package renderd-abr --package renderd-clock \
              -- --output-format bencher | tee bench-output.txt
          else
            echo "No benchmark targets scaffolded yet; skipping."
          fi
      - name: Store results
        if: hashFiles('bench-output.txt') != ''
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "110%"
          comment-on-alert: true
          fail-on-alert: false
