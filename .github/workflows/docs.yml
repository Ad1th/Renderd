name: Docs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build rustdoc
        run: |
          cargo doc --no-deps --workspace --exclude renderd-host --exclude renderd-viewer --exclude renderd-vt-sys --exclude renderd-sc-sys
          mkdir -p site/api
          cp -r target/doc/* site/api/
      - name: Upload Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.fork
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.fork
        uses: actions/deploy-pages@v4
        with:
          artifact-name: github-pages

