<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" role="img" aria-label="Renderd icon set">
  <title>Renderd Icon Set</title>
  <desc>System icons for Renderd — terminal-grid geometry, 24×24 grid, 2px stroke</desc>

  <!-- Background for preview -->
  <rect width="480" height="120" fill="#0D0D0D"/>

  <!-- ─── 1. Stream / Datagram Flow ─────────────── x=20 -->
  <g transform="translate(20, 20)">
    <!-- Frame stream: three horizontal bars with arrow -->
    <rect x="0" y="6"  width="48" height="4" rx="1" fill="none" stroke="#E8F4FD" stroke-width="2"/>
    <rect x="0" y="18" width="36" height="4" rx="1" fill="none" stroke="#E8F4FD" stroke-width="2"/>
    <rect x="0" y="30" width="24" height="4" rx="1" fill="none" stroke="#E8F4FD" stroke-width="2"/>
    <!-- Arrow tip -->
    <polyline points="44,0 56,8 44,16" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linejoin="round"/>
    <!-- label -->
    <text x="28" y="72" font-family="monospace" font-size="10" fill="#4A6070" text-anchor="middle">stream</text>
  </g>

  <!-- ─── 2. Network / QUIC peer ─────────────────── x=120 -->
  <g transform="translate(120, 20)">
    <!-- Two nodes with bidirectional arrow -->
    <circle cx="8"  cy="8"  r="6" fill="none" stroke="#E8F4FD" stroke-width="2"/>
    <circle cx="48" cy="8"  r="6" fill="none" stroke="#E8F4FD" stroke-width="2"/>
    <!-- Arrow line -->
    <line x1="14" y1="8" x2="42" y2="8" stroke="#00E5FF" stroke-width="2"/>
    <polyline points="38,4 42,8 38,12" fill="none" stroke="#00E5FF" stroke-width="2"/>
    <polyline points="18,4 14,8 18,12" fill="none" stroke="#00E5FF" stroke-width="2"/>
    <!-- Vertical sync lines (vsync metaphor) -->
    <line x1="28" y1="24" x2="28" y2="40" stroke="#E8F4FD" stroke-width="2"/>
    <line x1="20" y1="28" x2="36" y2="28" stroke="#E8F4FD" stroke-width="2"/>
    <!-- label -->
    <text x="28" y="72" font-family="monospace" font-size="10" fill="#4A6070" text-anchor="middle">p2p</text>
  </g>

  <!-- ─── 3. Encode / Codec ──────────────────────── x=220 -->
  <g transform="translate(220, 20)">
    <!-- Film-frame style: outer rect with side notches -->
    <rect x="0" y="0" width="56" height="40" rx="2" fill="none" stroke="#E8F4FD" stroke-width="2"/>
    <!-- Side notches left -->
    <rect x="-2" y="8"  width="6" height="8" rx="1" fill="#0D0D0D" stroke="#E8F4FD" stroke-width="1.5"/>
    <rect x="-2" y="24" width="6" height="8" rx="1" fill="#0D0D0D" stroke="#E8F4FD" stroke-width="1.5"/>
    <!-- Side notches right -->
    <rect x="52" y="8"  width="6" height="8" rx="1" fill="#0D0D0D" stroke="#E8F4FD" stroke-width="1.5"/>
    <rect x="52" y="24" width="6" height="8" rx="1" fill="#0D0D0D" stroke="#E8F4FD" stroke-width="1.5"/>
    <!-- Play triangle (encode) -->
    <polygon points="20,12 20,28 40,20" fill="#00E5FF"/>
    <!-- label -->
    <text x="28" y="72" font-family="monospace" font-size="10" fill="#4A6070" text-anchor="middle">encode</text>
  </g>

  <!-- ─── 4. Config / Settings ───────────────────── x=340 -->
  <g transform="translate(340, 20)">
    <!-- Three horizontal config lines with toggle dots -->
    <line x1="0" y1="8"  x2="56" y2="8"  stroke="#E8F4FD" stroke-width="2"/>
    <circle cx="16" cy="8"  r="5" fill="#0D0D0D" stroke="#00E5FF" stroke-width="2"/>
    <line x1="0" y1="24" x2="56" y2="24" stroke="#E8F4FD" stroke-width="2"/>
    <circle cx="36" cy="24" r="5" fill="#0D0D0D" stroke="#00E5FF" stroke-width="2"/>
    <line x1="0" y1="40" x2="56" y2="40" stroke="#E8F4FD" stroke-width="2"/>
    <circle cx="24" cy="40" r="5" fill="#0D0D0D" stroke="#00E5FF" stroke-width="2"/>
    <!-- label -->
    <text x="28" y="72" font-family="monospace" font-size="10" fill="#4A6070" text-anchor="middle">config</text>
  </g>
</svg>
