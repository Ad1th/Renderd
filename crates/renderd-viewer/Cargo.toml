[package]
name        = "renderd-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Windows viewer display client."

[dependencies]
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tokio              = { workspace = true }
winit              = { workspace = true }
softbuffer         = { workspace = true }
bytes              = { workspace = true }
quinn              = { workspace = true }
renderd-config     = { workspace = true }
renderd-proto      = { workspace = true }
renderd-frame      = { workspace = true }
renderd-clock      = { workspace = true }
renderd-abr        = { workspace = true }
renderd-crypto     = { workspace = true }
renderd-net        = { workspace = true }
renderd-keychain   = { workspace = true }
renderd-discovery  = { workspace = true }
uuid               = { workspace = true }
clap               = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_UI_HiDpi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Media_MediaFoundation", "Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_Media_KernelStreaming"] }

[target.'cfg(target_os = "macos")'.dependencies]
renderd-vt-sys = { workspace = true }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all                     = { level = "warn", priority = -1 }
pedantic                = { level = "warn", priority = -1 }
nursery                 = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
