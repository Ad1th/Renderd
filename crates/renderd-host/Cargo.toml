[package]
name        = "renderd-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "macOS host display mirroring agent."

[dependencies]
anyhow             = { workspace = true }
clap               = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tokio              = { workspace = true }
uuid               = { workspace = true }
bytes              = { workspace = true }
crossbeam-channel  = { workspace = true }
quinn              = { workspace = true }
renderd-config     = { workspace = true }
renderd-proto      = { workspace = true }
renderd-frame      = { workspace = true }
renderd-crypto     = { workspace = true }
renderd-net        = { workspace = true }
renderd-keychain   = { workspace = true }
renderd-discovery  = { workspace = true }
renderd-abr        = { workspace = true }
renderd-clock      = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2            = { workspace = true }
objc2-foundation = { workspace = true }
renderd-vt-sys   = { workspace = true }
renderd-sc-sys   = { workspace = true }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all                     = { level = "warn", priority = -1 }
pedantic                = { level = "warn", priority = -1 }
nursery                 = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
