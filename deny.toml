[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
]
deny = ["GPL-2.0", "GPL-3.0", "LGPL-2.0", "LGPL-3.0", "AGPL-3.0"]

[bans]
multiple-versions = "warn"
wildcards         = "deny"

# [advisories] — cargo-deny v2 removed the `vulnerability`, `unsound`, and
# `unmaintained` severity fields; all are denied by default in v2.
# `db-path` and `db-urls` remain valid for pointing to the advisory database.
[advisories]
db-urls       = ["https://github.com/rustsec/advisory-db"]
ignore        = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
